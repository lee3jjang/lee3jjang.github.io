---
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그 | 이상진</title>
  <meta name="description" content="이상진의 블로그: 리스크, 개발, 핀테크, AI에 대한 글">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>

  <p class="back"><a href="/">← 이상진</a></p>

  <h1>블로그</h1>
  <p class="subtitle">리스크, 개발, 핀테크, AI에 대해 씁니다.</p>

  {% if site.posts.size > 0 %}
  <ul class="post-list">
    {% for post in site.posts %}
    <li><span class="meta">{{ post.date | date: "%Y.%m.%d" }}</span> <a href="{{ post.url }}">{{ post.title }}</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="meta">아직 글이 없습니다.</p>
  {% endif %}

  <hr>
  <footer><a href="/">← 처음으로</a> · © {{ site.time | date: "%Y" }} 이상진</footer>

</main>
</body>
</html>
