<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | 이상진</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 140 }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 140 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>

  <p class="back"><a href="/blog/">← 블로그</a></p>

  <article>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%Y.%m.%d" }}{% if page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}</p>
    {{ content }}
  </article>

  <hr>
  <footer><a href="/blog/">← 블로그</a> · <a href="/">처음으로</a> · © {{ site.time | date: "%Y" }} 이상진</footer>

</main>
</body>
</html>
